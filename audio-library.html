<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#dce2d8">
  <title>Portal voice lines</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Courier New", Courier, monospace;
      background: #dce2d8;
      color: #202820;
      font-synthesis: none;
      --paper: #f6f5eb;
      --ink: #202820;
      --muted: #657064;
      --line: #c6ccbd;
      --green: #b7d83f;
      --orange: #e65d32;
    }

    * { box-sizing: border-box; }

    body {
      max-width: 1240px;
      margin: 0 auto;
      padding: 28px 30px 56px;
      min-height: 100vh;
      background-color: var(--paper);
      background-image:
        linear-gradient(#cfd5c7 1px, transparent 1px),
        linear-gradient(90deg, #cfd5c7 1px, transparent 1px);
      background-size: 24px 24px;
      border-inline: 1px solid #bec6b8;
    }

    .masthead {
      display: flex;
      justify-content: space-between;
      align-items: stretch;
      gap: 20px;
      padding: 22px 24px;
      background: var(--ink);
      color: var(--paper);
      border-bottom: 6px solid var(--orange);
    }

    .brand { display: flex; align-items: center; }

    h1 {
      margin: 0;
      font-family: Impact, "Arial Narrow", sans-serif;
      font-size: clamp(2rem, 5vw, 3.2rem);
      font-weight: 400;
      letter-spacing: 0;
      line-height: .96;
    }

    .intro { margin: 8px 0 0; color: #c5cdc0; font-size: .78rem; }

    .toolbar {
      display: grid;
      grid-template-columns: minmax(200px, 1.3fr) minmax(160px, 1fr) minmax(170px, 1fr) auto;
      gap: 10px;
      align-items: end;
      padding: 18px 22px;
      border-bottom: 2px solid var(--ink);
      background: var(--paper);
    }

    .field { display: grid; gap: 6px; min-width: 0; }
    .field label {
      color: var(--muted);
      font-size: .66rem;
      font-weight: bold;
      letter-spacing: .05em;
    }

    input, select, button, .download {
      min-height: 39px;
      border: 1px solid var(--ink);
      border-radius: 0;
      background: #fffef7;
      color: var(--ink);
      font: inherit;
      font-size: .8rem;
    }

    input, select { width: 100%; padding: 0 10px; }
    input::placeholder { color: #868c7f; }

    input:focus, select:focus, button:focus-visible, .download:focus-visible {
      outline: 2px solid var(--orange);
      outline-offset: 2px;
    }

    button, .download { padding: 0 12px; cursor: pointer; text-decoration: none; }
    button:hover, .download:hover { background: var(--green); }
    button:disabled { color: #788073; cursor: not-allowed; }
    .toolbar > button { height: 39px; background: var(--ink); color: var(--paper); }
    .toolbar > button:hover { background: var(--orange); }

    .summary {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-height: 44px;
      padding: 4px 22px;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      background: #ebece1;
      font-size: .72rem;
    }

    .summary strong { color: var(--ink); font-size: .88rem; }
    .selection { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .selection button { min-height: 29px; padding: 0 9px; font-size: .7rem; }
    #download-selected:not(:disabled) { border-color: var(--orange); background: var(--orange); color: #fffef7; }
    #download-selected:not(:disabled):hover { background: var(--ink); }
    #selected-count { font-size: .68rem; }

    .notice {
      margin: 0;
      padding: 12px 22px;
      border-bottom: 1px solid var(--line);
      border-left: 6px solid var(--orange);
      color: var(--ink);
      background: #f4e8d2;
      font-size: .76rem;
    }

    .notice.error { border-color: #a43c36; color: #7e2925; background: #f1ded6; }
    .list { display: grid; margin-top: 0; counter-reset: voice-line; }

    .item {
      display: grid;
      grid-template-columns: 20px minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      min-height: 72px;
      padding: 10px 22px;
      border-bottom: 1px solid var(--line);
      background: #f6f5eb;
    }

    .item:hover { background: #e9eddf; }
    .item > input { width: 15px; min-height: 15px; margin: 0; accent-color: var(--orange); }
    .dialogue { font-size: .88rem; line-height: 1.45; overflow-wrap: anywhere; }
    .meta { margin-top: 5px; color: var(--muted); font-size: .63rem; overflow-wrap: anywhere; }
    .actions { display: flex; align-items: center; gap: 8px; }
    .actions audio { width: 190px; max-width: 100%; height: 30px; }
    .download { display: inline-flex; align-items: center; justify-content: center; min-height: 30px; font-size: .68rem; white-space: nowrap; }

    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin: 0;
      padding: 18px;
      border-top: 2px solid var(--ink);
      background: #ebece1;
      color: var(--muted);
      font-size: .72rem;
    }

    .pagination button { min-height: 31px; }
    .empty { padding: 42px 16px; color: var(--muted); background: var(--paper); text-align: center; border-bottom: 1px solid var(--line); }

    @media (max-width: 940px) {
      .toolbar { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .toolbar > button { grid-column: 1 / -1; }
    }

    @media (max-width: 760px) {
      body { padding: 14px 12px 32px; }
      .masthead { padding: 17px 14px; }
      .toolbar { padding: 14px; }
      .toolbar > button { width: 100%; }
      .summary { padding: 6px 14px; }
      .item { grid-template-columns: 18px minmax(0, 1fr); gap: 8px; padding: 10px 14px; }
      .actions { grid-column: 2; flex-wrap: wrap; }
      .actions audio { width: min(100%, 240px); }
      .download { min-width: 92px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="masthead">
      <div>
        <div class="brand">
          <div>
            <h1>Portal voice lines</h1>
            <p class="intro">Browse, listen, and download.</p>
          </div>
        </div>
      </div>
    </div>
  </header>

  <section class="toolbar" aria-label="Audio filters">
    <div class="field">
      <label for="dialogue-search">Dialogue</label>
      <input id="dialogue-search" type="search" placeholder="Words in the line…" aria-label="Search dialogue">
    </div>
    <div class="field">
      <label for="character">Character</label>
      <select id="character" aria-label="Filter by character">
        <option value="">All speakers</option>
      </select>
    </div>
    <div class="field">
      <label for="collection">Collection</label>
      <select id="collection" aria-label="Filter by collection">
        <option value="">All collections</option>
      </select>
    </div>
    <button id="select-visible" type="button">Select page</button>
  </section>

  <section class="summary" aria-live="polite">
    <span id="count">Loading voice lines…</span>
    <span class="selection">
      <span id="selected-count">0 selected</span>
      <button id="download-selected" type="button" disabled>Download selected</button>
      <button id="clear-selection" type="button" disabled>Clear</button>
    </span>
  </section>

  <div id="notice" class="notice" role="status">
    Loading the voice-line catalog…
  </div>
  <main id="list" class="list" aria-label="Voice lines"></main>
  <nav class="pagination" aria-label="Results pages" hidden>
    <button id="previous" type="button">Previous</button>
    <span id="page-label"></span>
    <button id="next" type="button">Next</button>
  </nav>

  <script>
    "use strict";

    const catalogFiles = [
      "announcer_lines.json",
      "cave_lines.json",
      "detectiveturret_lines.json",
      "glados_lines_coop.json",
      "glados_lines_portal1.json",
      "glados_lines_portal2.json",
      "glados_lines_unused_alternative.json",
      "turret_lines.json",
      "wheatly_lines.json"
    ];
    const pageSize = 100;
    const rows = [];
    const selected = new Set();
    let filtered = [];
    let page = 0;

    const dialogueSearch = document.querySelector("#dialogue-search");
    const characterSelect = document.querySelector("#character");
    const collectionSelect = document.querySelector("#collection");
    const list = document.querySelector("#list");
    const countLabel = document.querySelector("#count");
    const selectedLabel = document.querySelector("#selected-count");
    const downloadSelected = document.querySelector("#download-selected");
    const clearSelection = document.querySelector("#clear-selection");
    const notice = document.querySelector("#notice");
    const pagination = document.querySelector(".pagination");

    function safeName(text, url) {
      let name = text.replace(/\s+/g, " ").trim();
      if (!name) {
        name = decodeURIComponent(new URL(url).pathname.split("/").pop() || "")
          .replace(/\.wav$/i, "");
      }
      name = name.replace(/[<>:"/\\|?*\x00-\x1f]/g, "_")
        .trim()
        .slice(0, 150)
        .replace(/[ .]+$/g, "");
      if (!name) name = "voice line";
      if (/^(CON|PRN|AUX|NUL|COM[1-9]|LPT[1-9])$/i.test(name)) name = `_${name}`;
      return name;
    }

    function characterName(file) {
      const slug = file.split("_lines", 1)[0].toLowerCase();
      const known = {
        glados: "GLaDOS",
        wheatly: "Wheatley",
        detectiveturret: "Detective Turret"
      };
      return known[slug] || slug.replace(/_/g, " ")
        .replace(/\b\w/g, (letter) => letter.toUpperCase());
    }

    function collectionName(file) {
      const names = {
        announcer_lines: "Announcer",
        cave_lines: "Cave Johnson",
        detectiveturret_lines: "Detective Turret",
        glados_lines_coop: "GLaDOS — Co-op",
        glados_lines_portal1: "GLaDOS — Portal 1",
        glados_lines_portal2: "GLaDOS — Portal 2",
        glados_lines_unused_alternative: "GLaDOS — Unused / alternative",
        turret_lines: "Turret",
        wheatly_lines: "Wheatley"
      };
      return names[file.replace(/\.json$/i, "")] || file.replace(/_lines.*$/i, "");
    }

    function makeCatalog(dataByFile) {
      const sourceCounts = new Map();
      const titleCounts = new Map();
      const sourcePaths = new Map();
      const titleKeys = new Set();

      for (const file of catalogFiles) {
        const character = characterName(file);
        const entries = dataByFile.get(file);
        for (const entry of entries) {
          if (!entry || typeof entry.dialogue !== "string" ||
              typeof entry.url !== "string") continue;
          let url;
          try {
            url = new URL(entry.url);
          } catch {
            continue;
          }
          if (url.protocol !== "https:" || !url.pathname.toLowerCase().endsWith(".wav")) continue;

          const sourceKey = `${character}\0${entry.url}`;
          if (!sourcePaths.has(sourceKey)) {
            const originalName = `${safeName(
              decodeURIComponent(url.pathname.split("/").pop()).replace(/\.wav$/i, ""),
              entry.url
            )}.wav`;
            const collisionKey = `${character}\0${originalName}`;
            const occurrence = (sourceCounts.get(collisionKey) || 0) + 1;
            sourceCounts.set(collisionKey, occurrence);
            const suffix = occurrence > 1 ? ` (${occurrence})` : "";
            sourcePaths.set(sourceKey,
              `voicelines/audio/${encodeURIComponent(character)}/${encodeURIComponent(originalName.replace(/\.wav$/i, ""))}${suffix}.wav`);
          }

          const title = safeName(entry.dialogue, entry.url);
          const titleKey = `${character}\0${entry.url}\0${title}`;
          if (titleKeys.has(titleKey)) continue;
          titleKeys.add(titleKey);
          const collisionKey = `${character}\0${title}`;
          const occurrence = (titleCounts.get(collisionKey) || 0) + 1;
          titleCounts.set(collisionKey, occurrence);
          const suffix = occurrence > 1 ? ` (${occurrence})` : "";

          rows.push({
            id: titleKey,
            character,
            collection: file,
            dialogue: entry.dialogue.trim() || title,
            filename: decodeURIComponent(url.pathname.split("/").pop()),
            audio: sourcePaths.get(sourceKey),
            title,
            downloadName: `${title}${suffix}.wav`
          });
        }
      }
    }

    function updateSelection() {
      selectedLabel.textContent = `${selected.size} selected`;
      downloadSelected.disabled = selected.size === 0;
      clearSelection.disabled = selected.size === 0;
    }

    function render() {
      const dialogueQuery = dialogueSearch.value.trim().toLocaleLowerCase();
      const character = characterSelect.value;
      const collection = collectionSelect.value;
      filtered = rows.filter((row) =>
        (!character || row.character === character) &&
        (!collection || row.collection === collection) &&
        (!dialogueQuery || row.dialogue.toLocaleLowerCase().includes(dialogueQuery))
      );
      const pageCount = Math.max(1, Math.ceil(filtered.length / pageSize));
      page = Math.min(page, pageCount - 1);
      countLabel.innerHTML = `<strong>${filtered.length.toLocaleString()}</strong> voice lines`;
      list.replaceChildren();

      if (!filtered.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "No matching voice lines.";
        list.append(empty);
      } else {
        const fragment = document.createDocumentFragment();
        const start = page * pageSize;
        for (const row of filtered.slice(start, start + pageSize)) {
          const article = document.createElement("article");
          article.className = "item";

          const checkbox = document.createElement("input");
          checkbox.type = "checkbox";
          checkbox.checked = selected.has(row.id);
          checkbox.setAttribute("aria-label", `Select: ${row.dialogue}`);
          checkbox.addEventListener("change", () => {
            if (checkbox.checked) selected.add(row.id);
            else selected.delete(row.id);
            updateSelection();
          });

          const content = document.createElement("div");
          const dialogue = document.createElement("div");
          dialogue.className = "dialogue";
          dialogue.textContent = row.dialogue;
          const meta = document.createElement("div");
          meta.className = "meta";
          meta.textContent = `${row.character} · ${row.filename}`;
          content.append(dialogue, meta);

          const actions = document.createElement("div");
          actions.className = "actions";
          const audio = document.createElement("audio");
          audio.controls = true;
          audio.preload = "none";
          audio.src = row.audio;
          audio.setAttribute("aria-label", `Preview: ${row.dialogue}`);
          audio.addEventListener("play", () => {
            document.querySelectorAll("audio").forEach((other) => {
              if (other !== audio) other.pause();
            });
          });

          const download = document.createElement("a");
          download.className = "download";
          download.href = row.audio;
          download.download = row.downloadName;
          download.textContent = "Download WAV";
          actions.append(audio, download);
          article.append(checkbox, content, actions);
          fragment.append(article);
        }
        list.append(fragment);
      }

      pagination.hidden = filtered.length <= pageSize;
      document.querySelector("#page-label").textContent =
        `Page ${page + 1} of ${pageCount}`;
      document.querySelector("#previous").disabled = page === 0;
      document.querySelector("#next").disabled = page >= pageCount - 1;
    }

    async function init() {
      const results = await Promise.allSettled(catalogFiles.map(async (file) => {
        const response = await fetch(`voicelines_json/${encodeURIComponent(file)}`);
        if (!response.ok) throw new Error(`${file}: HTTP ${response.status}`);
        const data = await response.json();
        if (!Array.isArray(data)) throw new Error(`${file}: expected a JSON array`);
        return [file, data];
      }));

      const dataByFile = new Map();
      const errors = [];
      for (const result of results) {
        if (result.status === "fulfilled") dataByFile.set(...result.value);
        else errors.push(result.reason.message);
      }
      if (!dataByFile.size) {
        notice.className = "notice error";
        notice.textContent = `Could not load the catalog. Serve the repository over HTTP (for example: python -m http.server). ${errors.join("; ")}`;
        countLabel.textContent = "Catalog unavailable";
        return;
      }

      makeCatalog(dataByFile);
      if (errors.length) {
        notice.className = "notice error";
        notice.textContent = `Some catalog files could not be loaded: ${errors.join("; ")}`;
      } else {
        notice.remove();
      }

      [...new Set(rows.map((row) => row.character))]
        .sort((a, b) => a.localeCompare(b))
        .forEach((name) => {
          const option = document.createElement("option");
          option.value = name;
          option.textContent = name;
          characterSelect.append(option);
        });

      [...new Set(rows.map((row) => row.collection))]
        .sort((a, b) => collectionName(a).localeCompare(collectionName(b)))
        .forEach((file) => {
          const option = document.createElement("option");
          option.value = file;
          option.textContent = collectionName(file);
          collectionSelect.append(option);
        });
      render();
    }

    dialogueSearch.addEventListener("input", () => { page = 0; render(); });
    characterSelect.addEventListener("change", () => { page = 0; render(); });
    collectionSelect.addEventListener("change", () => { page = 0; render(); });
    document.querySelector("#previous").addEventListener("click", () => {
      page -= 1;
      render();
    });
    document.querySelector("#next").addEventListener("click", () => {
      page += 1;
      render();
    });
    document.querySelector("#select-visible").addEventListener("click", () => {
      const start = page * pageSize;
      filtered.slice(start, start + pageSize).forEach((row) => selected.add(row.id));
      render();
      updateSelection();
    });
    clearSelection.addEventListener("click", () => {
      selected.clear();
      render();
      updateSelection();
    });
    downloadSelected.addEventListener("click", () => {
      for (const row of rows.filter((item) => selected.has(item.id))) {
        const link = document.createElement("a");
        link.href = row.audio;
        link.download = row.downloadName;
        link.style.display = "none";
        document.body.append(link);
        link.click();
        link.remove();
      }
    });

    init().catch((error) => {
      notice.className = "notice error";
      notice.textContent = `Catalog error: ${error.message}`;
      countLabel.textContent = "Catalog unavailable";
    });
  </script>
</body>
</html>
